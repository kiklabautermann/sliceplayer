[package]
name = "slice_player"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
egui = "0.31"
atomic_float = "0.1"
hound = "3.5"
midly = "0.5"
rfd = "0.15"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5", features = ["all"] }
zip = "2.1"

[build-dependencies]
cc = "1.2"

[features]
default = []
