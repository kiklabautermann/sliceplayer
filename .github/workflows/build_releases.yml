name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: slice_player-linux-x64.clap
            binary_path: target/x86_64-unknown-linux-gnu/release/libslice_player.so
          - os: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            artifact_name: slice_player-macos-arm64.clap
            binary_path: target/aarch64-apple-darwin/release/libslice_player.dylib
          - os: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: slice_player-windows-x64.clap
            binary_path: target/x86_64-pc-windows-msvc/release/slice_player.dll

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libfontconfig1-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev libx11-xcb-dev libx11-dev

      - name: Build CLAP Plugin Bundle
        run: cargo build --release -p slice_player --target ${{ matrix.target }}

      - name: Copy & Rename Artifact
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.binary_path }} dist/${{ matrix.artifact_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
